# Hourly check that the live site's data is still updating (scripts/check-fresh.mjs). The other jobs can all
# "succeed" while publishing old data (a source quietly serving a saved copy, a reused file); this catches that.
# A failure here sends GitHub's failed-workflow email. Since Oct 2026 cron-job.org starts it every hour
# (workflow_dispatch); GitHub's own schedule below is often late or skipped, so it is only a backup.
name: Freshness check

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write      # to cancel a deploy GitHub left stuck (below)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # GitHub sometimes leaves a deploy "waiting" on its Pages environment for hours (no reviewers, no timer: a
      # GitHub-side hang, seen on 5 and 6 Oct 2026). While it waits, every newer update queued behind it in the "pages"
      # group is cancelled, so the site stops updating. A deploy still waiting or queued after 25 minutes is cancelled
      # here, and the next scheduled update goes through.
      - name: Cancel deploys stuck in waiting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d "25 minutes ago" +%s)
          gh run list -R "$GITHUB_REPOSITORY" --workflow update-data.yml --limit 40 --json databaseId,status,createdAt \
            --jq '.[] | select(.status == "waiting" or .status == "queued") | "\(.databaseId) \(.createdAt)"' |
          while read -r id at; do
            if [ "$(date -u -d "$at" +%s)" -lt "$cutoff" ]; then
              echo "::warning::deploy run $id stuck since $at: cancelling it so the updates behind it can run"
              gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            fi
          done
      - run: node scripts/check-fresh.mjs https://heat.sala.company
