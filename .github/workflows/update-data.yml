# Every 10 minutes: fetch market data on GitHub's servers and publish index.html + data.json to GitHub Pages.
# Visitors only download data.json, so they never hit CoinGecko or the exchanges themselves.
name: Update heatmap data

on:
  schedule:
    - cron: '7-59/10 * * * *'   # :07, :17, :27…; avoids the top-of-hour rush when GitHub delays or drops scheduled runs
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      # Browsers may reuse each file for 10 minutes, so right after a release a page could run with some old cached
      # scripts (e.g. new /metals/ page + old app/markets.mjs = crypto). Tag every script address with the commit, in
      # this checkout only, so a page always loads the scripts of its own release.
      - name: Version the script addresses
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s#src=\"/app/main.mjs\"#src=\"/app/main.mjs?v=$V\"#" index.html
          sed -i "s#\(from '[^']*\.mjs\)'#\1?v=$V'#g; s#^\(import '[^']*\.mjs\)'#\1?v=$V'#; s#import('/scripts/build-data.mjs')#import('/scripts/build-data.mjs?v=$V')#" app/*.mjs
          grep -q "main.mjs?v=$V" index.html && ! grep -hE "from '|^import '" app/*.mjs | grep -v "?v=$V'" | grep -q .

      - name: Fetch market data
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/data.json
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # CoinGecko blocks GitHub's IPs without a key
        run: |
          mkdir -p _site
          mkdir -p _site/scripts
          cp index.html signals.mjs robots.txt og-image.png og-image-forex.png og-image-metals.png _site/
          cp -r app _site/   # the page script, in modules (app/main.mjs starts it)
          # sitemap for search engines: the crypto, forex and metals pages, whose data changes every day
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://heat.sala.company/</loc><lastmod>%s</lastmod><changefreq>hourly</changefreq></url>\n  <url><loc>https://heat.sala.company/forex/</loc><lastmod>%s</lastmod><changefreq>daily</changefreq></url>\n  <url><loc>https://heat.sala.company/metals/</loc><lastmod>%s</lastmod><changefreq>daily</changefreq></url>\n</urlset>\n' "$(date -u +%F)" "$(date -u +%F)" "$(date -u +%F)" > _site/sitemap.xml
          cp scripts/build-data.mjs _site/scripts/   # the page runs it itself if data.json ever goes stale
          [ -f data/scorecard.json ] && cp data/scorecard.json _site/ || true
          [ -f data/pairs.json ] && cp data/pairs.json _site/ || true
          node scripts/build-data.mjs _site/data.json

      # Forex: the same page at /forex/ (with forex search tags) and forex.json. Rates change once a day, so the build
      # reuses the last file and refetches hourly. A forex failure republishes the last good file and never blocks
      # the crypto update.
      - name: Fetch forex rates
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/forex.json
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/market-page.mjs forex _site/forex/index.html
          [ -f data/forex-scorecard.json ] && cp data/forex-scorecard.json _site/ || true
          node scripts/build-forex.mjs _site/forex.json \
            || { echo "::warning::forex build failed, republishing the last forex.json"; curl -sf "$BASE_URL/forex.json" -o _site/forex.json || true; }

      # Metals: /metals/ (same page, metals search tags) and metals.json: gold, silver, platinum, palladium from the
      # public-domain feed (refetched hourly) plus PAXG, XAUT and Bitcoin copied from the data.json just built.
      # A failure republishes the last good file and never blocks the rest of the deploy.
      - name: Fetch metals prices
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/metals.json
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/market-page.mjs metals _site/metals/index.html
          node scripts/build-metals.mjs _site/metals.json _site/data.json \
            || { echo "::warning::metals build failed, republishing the last metals.json"; curl -sf "$BASE_URL/metals.json" -o _site/metals.json || true; }

      # TradingView chart links: check which symbols exist there (cached in tv.json, so only new or expired ones are
      # looked up), so the popup never links to a "symbol not found" page. A failure keeps the last tv.json.
      - name: Check TradingView symbols
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/tv.json
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp scripts/tradingview.mjs _site/scripts/   # the page imports it for the link
          timeout 90 node scripts/tradingview.mjs _site/tv.json _site/data.json _site/forex.json _site/metals.json \
            || { echo "::warning::TradingView check failed, republishing the last tv.json"; curl -sf "$BASE_URL/tv.json" -o _site/tv.json || true; }

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
      # No keep-alive needed: score-signals.yml commits the scorecard daily, which keeps the schedules active.
