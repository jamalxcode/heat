# Unit tests (node --test) on every push to any branch and on pull requests, so a branch is checked before it reaches main.
name: Tests

on:
  push:
    branches: ['**']   # every branch: work happens on a branch and is merged into main only when this passes
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test   # finds tests/*.test.mjs
      # TEMPORARY (rates-world branch only): do ChinaBond and FBIL answer GitHub's servers?
      - run: |
          curl -s -m 40 -A "Mozilla/5.0" -X POST "https://yield.chinabond.com.cn/cbweb-mn/yc/searchYc?xyzSelect=txy&&workTimes=2026-09-30,2026-09-29&&dxbj=0&&qxll=0,&&yqqxN=N&&yqqxK=K&&ycDefIds=2c9081e50a2f9606010a3068cae70001,&&wrjxCBFlag=0&&locale=en_US" -w "\nChinaBond %{http_code} %{size_download} %{time_total}s\n" | tail -c 200 || true
          curl -s -m 40 -A "Mozilla/5.0" "https://www.fbil.org.in/wasdm/gsec/downloadPublished?date=2026-09-29" -o /tmp/g.xlsx -w "FBIL gsec %{http_code} %{size_download} %{time_total}s\n" || true
          curl -s -m 40 -A "Mozilla/5.0" "https://www.fbil.org.in/wasdm/tbill/fetch?authenticated=false" -o /dev/null -w "FBIL tbill %{http_code} %{size_download}\n" || true
