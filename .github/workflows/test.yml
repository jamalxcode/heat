# Unit tests (node --test) on every push to any branch and on pull requests, so a branch is checked before it reaches main.
name: Tests

on:
  push:
    branches: ['**']   # every branch: work happens on a branch and is merged into main only when this passes
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test   # finds tests/*.test.mjs
      # TEMPORARY (rates-more branch only): what do the RBA yield files look like?
      - run: |
          for f in f2.1 f2 f1.1; do
            curl -s -A "Mozilla/5.0" "https://www.rba.gov.au/statistics/tables/csv/$f-data.csv" -o /tmp/$f.csv
            echo "=== $f $(wc -c < /tmp/$f.csv) bytes"; head -13 /tmp/$f.csv | cut -c1-500; echo ...; tail -3 /tmp/$f.csv | cut -c1-500
          done
