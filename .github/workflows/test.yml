# Unit tests (node --test) on every push to any branch and on pull requests, so a branch is checked before it reaches main.
name: Tests

on:
  push:
    branches: ['**']   # every branch: work happens on a branch and is merged into main only when this passes
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test   # finds tests/*.test.mjs
      # TEMPORARY (rates-more branch only): do the yield sources answer GitHub's servers?
      - run: |
          curl -s -o /dev/null -w "RBA %{http_code}\n" -A "Mozilla/5.0" https://www.rba.gov.au/statistics/tables/csv/f2.1-data.csv || true
